name: Build core

on:
  push:
  pull_request:

jobs:
  core-tests:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build app and DriverKit extension
        run: >-
          xcodebuild build
          -project DNPDirectPrint.xcodeproj
          -scheme DNPDirectPrint
          -destination 'generic/platform=iOS'
          CODE_SIGNING_ALLOWED=NO
      - name: Test protocol and raster job builder
        run: >-
          xcodebuild test
          -project DNPDirectPrint.xcodeproj
          -scheme DNPPrintCoreTests
          -destination 'platform=macOS,variant=Mac Catalyst'
          CODE_SIGNING_ALLOWED=NO
